<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexcent - Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">
      <img src="assets/logo.svg" alt="Nexcent" width="155" height="24" class="logo-img">
    </a>
    <div class="nav-right">
      <ul class="nav-links">
        <li class="nav-home"><a href="#home" class="nav-link">Home</a></li>
        <li><a href="#features" class="nav-link">Features</a></li>
        <li><a href="#community" class="nav-link">Community</a></li>
        <li><a href="#blog" class="nav-link">Blog</a></li>
        <li><a href="#pricing" class="nav-link">Pricing</a></li>
      </ul>
      <a href="#register" class="btn btn-arrow">
        <span>Register Now</span>
        <img src="assets/arrow-right.svg" alt="" class="arrow-icon">
      </a>
    </div>
  </nav>

  <header class="header" id="home">
    <div class="hero-content">
      <h1 class="hero-title">
        Lessons and insights<br>
        <span class="highlight">from 8 years</span>
        <span class="hero-price">$880.23</span>
      </h1>
      <p class="hero-text">Where to grow your business as a photographer: site or social media?</p>
      <a href="#register" class="btn hero-btn">Register</a>
    </div>
    <div>
      <img src="assets/hero.svg" alt="Hero illustration" class="hero-img">
    </div>
    <div class="hero-dots">
      <span class="dot dot-active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </header>

</body>
</html>
